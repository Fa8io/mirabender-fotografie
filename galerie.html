<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie – Mira Bender Fotografie</title>
  <link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body>

  <header class="site-header">
    <div class="logo"><a href="index.html">Mira Bender Fotografie</a></div>
    <button class="nav-toggle" id="navToggle" aria-label="Menü öffnen" aria-expanded="false" aria-controls="mainNav">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="galerie.html?cat=3">Hochzeiten</a></li>
        <li><a href="galerie.html?cat=2">Portrait</a></li>
        <li><a href="galerie.html?cat=1">Fotojournalismus</a></li>
        <li><a href="galerie.html?cat=4">Freie Kunst</a></li>
        <li><a href="galerie.html?cat=5">Street</a></li>
        <li class="nav-item-spacer"><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main class="gallery-page">
    <header class="gallery-title">
      <h1 id="dynamic-title">Laden...</h1>
    </header>

    <div class="photo-grid-horizontal" id="image-container">
      </div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Schließen">&times;</button>
    <button class="lightbox-prev" id="lightboxPrev" aria-label="Vorheriges Bild">&#8249;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <button class="lightbox-next" id="lightboxNext" aria-label="Nächstes Bild">&#8250;</button>
  </div>

  <footer class="site-footer">
    <div class="footer-content">
      <p>&copy; 2026 Mira Bender Fotografie</p>
      <nav class="footer-nav">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
        <a href="agb.html">AGB</a>
      </nav>
    </div>
  </footer>

<script src="js/main.js?v=4"></script>
<script>
  // --- KONFIGURATION DER BILDER ---
  // Hier trägst du die Dateinamen ein, die in deinen Ordnern liegen.
  const config = {
  '1': {
    title: 'Fotojournalismus Kolonialismus',
    folder: 'images/1FotojournalismusKolonialismus/',
    images: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg']
  },
  '2': {
    title: 'Portraitfotografie',
    // Wie bei Hochzeiten: eigene Reihenfolge für breite (Desktop) und
    // schmale (Handy) Bildschirme.
    responsive: {
      desktop: {
        folder: 'images/2Portraitfotografie/desktop/',
        images: ['1.jpg', '2.jpg', '2,5.jpg', '3.jpg', '3,5.jpeg', '4.jpg', '4,5.jpg', '5.jpg', '5,5.jpg', '6.jpg', '6,5.jpg', '7.jpg', '8.jpg', '8,5.jpg', '8,6.jpg', '9.jpeg', '9,5.jpeg', '10.jpg', '16.jpg', '19.jpg']
      },
      mobile: {
        folder: 'images/2Portraitfotografie/handy/',
        images: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '8,5.jpg', '9.jpeg', '10.jpg', '11.jpeg', '12.jpg', '13.jpg', '14.jpg', '15.jpg', '16.jpg', '17.jpeg', '18.jpg', '19.jpg']
      }
    }
  },
  '3': {
    title: 'Hochzeiten',
    // Zwei Bild-Reihenfolgen: eine fürs breite Display (Desktop), eine für
    // schmale Bildschirme (Handy) - welche aktiv ist, hängt von derselben
    // Grenze ab wie beim Hamburger-Menü/Mobile-Raster (siehe mobileQuery).
    responsive: {
      desktop: {
        folder: 'images/3Hochzeiten/desktop/',
        images: ['1.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.jpg', '10.jpg', '11.jpg', '12.jpg', '13.jpg', '14.jpg']
      },
      mobile: {
        folder: 'images/3Hochzeiten/handy/',
        images: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.jpg', '10.jpg', '11.jpg', '12.jpg', '13.jpg', '14.jpg']
      }
    }
  },
  '4': {
    title: 'Freie Kunst',
    folder: 'images/4FreieKunst/',
    images: ['1.jpg', '2.jpg', '2,2.jpg', '3.jpg', '3.3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg']
  },
  '5': {
    title: 'Street',
    folder: 'images/5RubrikStreet/',
    images: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.jpg', '10.jpg', '11.jpg']
  }
};

  // --- DYNAMISCHE LOGIK ---
  const urlParams = new URLSearchParams(window.location.search);
  const catID = urlParams.get('cat') || '1'; // Falls nichts angegeben, zeige Rubrik 1
  const selection = config[catID];

  const container = document.getElementById('image-container');
  const titleH1 = document.getElementById('dynamic-title');
  const imageSources = [];

  // Gleiche Grenze wie beim Hamburger-Menü/Mobile-Raster in styles.css:
  // schmaler Bildschirm ODER wenig Höhe im Querformat gilt als "mobil".
  const mobileQuery = window.matchMedia('(max-width: 640px), (max-height: 500px) and (orientation: landscape)');

  function getActiveVariant() {
    if (selection.responsive) {
      return mobileQuery.matches ? selection.responsive.mobile : selection.responsive.desktop;
    }
    return selection;
  }

  function buildGallery() {
    container.innerHTML = '';
    imageSources.length = 0;

    const variant = getActiveVariant();

    variant.images.forEach((fileName, index) => {
      const src = variant.folder + fileName;
      imageSources.push(src);

      const item = document.createElement('div');
      item.className = 'photo-item-horizontal';

      const img = document.createElement('img');
      img.className = 'fade-img';
      img.src = src;
      img.alt = selection.title;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.dataset.index = index;

      item.appendChild(img);
      container.appendChild(item);
    });

    initFadeImages(container);
  }

  if (selection) {
    // 1. Titel der Seite setzen
    titleH1.innerText = selection.title;
    document.title = selection.title + " – Mira Bender";

    // 2. Bilder generieren und einfügen
    buildGallery();

    // Beim Überschreiten der Grenze (z.B. Handy gedreht, Fenster in der
    // Breite verändert) die passende Bilder-Reihenfolge neu laden.
    mobileQuery.addEventListener('change', () => {
      closeLightbox();
      buildGallery();
    });
  }

  // --- DEIN BESTEHENDES SCROLL- & DRAG-SKRIPT ---
  // (Füge hier den gesamten Code für 'wheel', 'mousedown' etc. ein, den wir zuvor erstellt haben)
  const scrollContainer = document.querySelector('.photo-grid-horizontal');

  scrollContainer.addEventListener('wheel', (evt) => {
    if (evt.deltaY !== 0) {
      evt.preventDefault();
      scrollContainer.scrollLeft += evt.deltaY * 1.5; 
    }
  }, { passive: false });

  let isDown = false;
  let startX;
  let scrollLeft;
  let didDrag = false;

  // Wichtig: Da Bilder dynamisch kommen, müssen wir dragstart nach dem Laden verhindern
  container.addEventListener('dragstart', (e) => {
    if (e.target.tagName === 'IMG') e.preventDefault();
  });

  scrollContainer.addEventListener('mousedown', (e) => {
    isDown = true;
    didDrag = false;
    scrollContainer.style.cursor = 'grabbing';
    startX = e.pageX - scrollContainer.offsetLeft;
    scrollLeft = scrollContainer.scrollLeft;
  });

  const stopDragging = () => {
    isDown = false;
    scrollContainer.style.cursor = 'grab';
  };

  scrollContainer.addEventListener('mouseleave', stopDragging);
  scrollContainer.addEventListener('mouseup', stopDragging);
  window.addEventListener('mouseup', stopDragging);

  scrollContainer.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - scrollContainer.offsetLeft;
    const walk = (x - startX) * 2;
    if (Math.abs(walk) > 5) didDrag = true;
    scrollContainer.scrollLeft = scrollLeft - walk;
  });

  // --- LIGHTBOX: Bild antippen/anklicken = groß anzeigen ---
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxPrev = document.getElementById('lightboxPrev');
  const lightboxNext = document.getElementById('lightboxNext');
  let currentIndex = 0;

  function showImage(index) {
    currentIndex = (index + imageSources.length) % imageSources.length;
    lightboxImg.classList.remove('is-loaded');
    lightboxImg.src = imageSources[currentIndex];
    lightboxImg.alt = selection ? selection.title : '';
  }

  function openLightbox(index) {
    if (!imageSources.length) return;
    showImage(index);
    lightbox.classList.add('is-active');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('is-active');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  lightboxImg.addEventListener('load', () => lightboxImg.classList.add('is-loaded'));

  container.addEventListener('click', (e) => {
    const img = e.target.closest('img');
    if (!img || didDrag) return;
    openLightbox(Number(img.dataset.index));
  });

  lightboxClose.addEventListener('click', closeLightbox);
  lightboxPrev.addEventListener('click', () => showImage(currentIndex - 1));
  lightboxNext.addEventListener('click', () => showImage(currentIndex + 1));

  // Klick auf den dunklen Hintergrund schließt die Ansicht
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('is-active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
    if (e.key === 'ArrowRight') showImage(currentIndex + 1);
  });

  // Wischen (Touch) blättert in der Großbild-Ansicht weiter/zurück
  let touchStartX = null;

  lightbox.addEventListener('touchstart', (e) => {
    if (e.target.closest('button')) { touchStartX = null; return; }
    touchStartX = e.changedTouches[0].clientX;
  }, { passive: true });

  lightbox.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const deltaX = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if (Math.abs(deltaX) < 40) return;
    if (deltaX < 0) showImage(currentIndex + 1);
    else showImage(currentIndex - 1);
  }, { passive: true });
</script>

</body>
</html>
