<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie – Mira Bender Fotografie</title>
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>

  <header class="site-header">
    <div class="logo"><a href="index.html">Mira Bender Fotografie</a></div>
    <button class="nav-toggle" id="navToggle" aria-label="Menü öffnen" aria-expanded="false" aria-controls="mainNav">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="galerie.html?cat=1">Fotojournalismus</a></li>
        <li><a href="galerie.html?cat=2">Portrait</a></li>
        <li><a href="galerie.html?cat=3">Hochzeiten</a></li>
        <li><a href="galerie.html?cat=4">Freie Kunst</a></li>
        <li><a href="galerie.html?cat=5">Street</a></li>
        <li class="nav-item-spacer"><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main class="gallery-page">
    <header class="gallery-title">
      <h1 id="dynamic-title">Laden...</h1>
    </header>

    <div class="photo-grid-horizontal" id="image-container">
      </div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Schließen">&times;</button>
    <button class="lightbox-prev" id="lightboxPrev" aria-label="Vorheriges Bild">&#8249;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <button class="lightbox-next" id="lightboxNext" aria-label="Nächstes Bild">&#8250;</button>
  </div>

  <footer class="site-footer">
    <div class="footer-content">
      <p>&copy; 2026 Mira Bender Fotografie</p>
      <nav class="footer-nav">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </div>
  </footer>

<script src="js/main.js?v=3"></script>
<script>
  // --- KONFIGURATION DER BILDER ---
  // Hier trägst du die Dateinamen ein, die in deinen Ordnern liegen.
  const config = {
  '1': {
    title: 'Fotojournalismus Kolonialismus',
    folder: 'images/1FotojournalismusKolonialismus/',
    images: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg']
  },
  '2': {
    title: 'Portraitfotografie',
    folder: 'images/2Portraitfotografie/', // Name ohne Leerzeichen laut Screenshot
    images: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.jpg', '10.jpeg', '11.jpg', '12.jpg', '13.jpg', '14.jpeg', '15.jpeg', '16.jpg', '17.jpg']
  },
  '3': {
    title: 'Hochzeiten',
    folder: 'images/3Hochzeiten/', // Name ohne Leerzeichen laut Screenshot
    images: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.jpg', '10.jpg', '11.jpg']
  },
  '4': {
    title: 'Freie Kunst',
    folder: 'images/4FreieKunst/', // Name ohne Leerzeichen laut Screenshot
    images: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.jpg']
  },
  '5': {
    title: 'Street',
    folder: 'images/5RubrikStreet/', // ACHTUNG: Laut Screenshot heißt dieser Ordner "5RubrikStreet"
    images: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.jpg', '10.jpg', '11.jpg', '12.jpg', '13.jpg']
  }
};

  // --- DYNAMISCHE LOGIK ---
  const urlParams = new URLSearchParams(window.location.search);
  const catID = urlParams.get('cat') || '1'; // Falls nichts angegeben, zeige Rubrik 1
  const selection = config[catID];

  const container = document.getElementById('image-container');
  const titleH1 = document.getElementById('dynamic-title');
  const imageSources = [];

  if (selection) {
    // 1. Titel der Seite setzen
    titleH1.innerText = selection.title;
    document.title = selection.title + " – Mira Bender";

    // 2. Bilder generieren und einfügen
    selection.images.forEach((fileName, index) => {
      const src = selection.folder + fileName;
      imageSources.push(src);

      const item = document.createElement('div');
      item.className = 'photo-item-horizontal';

      const img = document.createElement('img');
      img.className = 'fade-img';
      img.src = src;
      img.alt = selection.title;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.dataset.index = index;

      item.appendChild(img);
      container.appendChild(item);
    });

    initFadeImages(container);
  }

  // --- DEIN BESTEHENDES SCROLL- & DRAG-SKRIPT ---
  // (Füge hier den gesamten Code für 'wheel', 'mousedown' etc. ein, den wir zuvor erstellt haben)
  const scrollContainer = document.querySelector('.photo-grid-horizontal');

  scrollContainer.addEventListener('wheel', (evt) => {
    if (evt.deltaY !== 0) {
      evt.preventDefault();
      scrollContainer.scrollLeft += evt.deltaY * 1.5; 
    }
  }, { passive: false });

  let isDown = false;
  let startX;
  let scrollLeft;
  let didDrag = false;

  // Wichtig: Da Bilder dynamisch kommen, müssen wir dragstart nach dem Laden verhindern
  container.addEventListener('dragstart', (e) => {
    if (e.target.tagName === 'IMG') e.preventDefault();
  });

  scrollContainer.addEventListener('mousedown', (e) => {
    isDown = true;
    didDrag = false;
    scrollContainer.style.cursor = 'grabbing';
    startX = e.pageX - scrollContainer.offsetLeft;
    scrollLeft = scrollContainer.scrollLeft;
  });

  const stopDragging = () => {
    isDown = false;
    scrollContainer.style.cursor = 'grab';
  };

  scrollContainer.addEventListener('mouseleave', stopDragging);
  scrollContainer.addEventListener('mouseup', stopDragging);
  window.addEventListener('mouseup', stopDragging);

  scrollContainer.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - scrollContainer.offsetLeft;
    const walk = (x - startX) * 2;
    if (Math.abs(walk) > 5) didDrag = true;
    scrollContainer.scrollLeft = scrollLeft - walk;
  });

  // --- LIGHTBOX: Bild antippen/anklicken = groß anzeigen ---
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxPrev = document.getElementById('lightboxPrev');
  const lightboxNext = document.getElementById('lightboxNext');
  let currentIndex = 0;

  function showImage(index) {
    currentIndex = (index + imageSources.length) % imageSources.length;
    lightboxImg.classList.remove('is-loaded');
    lightboxImg.src = imageSources[currentIndex];
    lightboxImg.alt = selection ? selection.title : '';
  }

  function openLightbox(index) {
    if (!imageSources.length) return;
    showImage(index);
    lightbox.classList.add('is-active');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('is-active');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  lightboxImg.addEventListener('load', () => lightboxImg.classList.add('is-loaded'));

  container.addEventListener('click', (e) => {
    const img = e.target.closest('img');
    if (!img || didDrag) return;
    openLightbox(Number(img.dataset.index));
  });

  lightboxClose.addEventListener('click', closeLightbox);
  lightboxPrev.addEventListener('click', () => showImage(currentIndex - 1));
  lightboxNext.addEventListener('click', () => showImage(currentIndex + 1));

  // Klick auf den dunklen Hintergrund schließt die Ansicht
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('is-active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
    if (e.key === 'ArrowRight') showImage(currentIndex + 1);
  });
</script>

</body>
</html>
